buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath "org.flywaydb:flyway-database-postgresql:11.8.2"
    classpath "org.postgresql:postgresql:42.7.5"
  }
}

plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.11'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'jacoco'
  id 'org.flywaydb.flyway' version '11.8.2'
}

group = 'uk.gov.hmcts'
version = '1.0.0'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

/* ─────────────────────────────────────────────
   Versions
───────────────────────────────────────────── */
ext {
  mapstructVersion = '1.6.3'
  lombokVersion = '1.18.44'
  lombokMapstructBindingVersion = '0.2.0'
  testcontainersVersion = '1.20.4'
  restAssuredVersion = '5.5.0'
  springdocVersion = '2.8.3'
  jacocoVersion = '0.8.12'
  postgresqlVersion = '42.7.5'
}

/* ─────────────────────────────────────────────
   Repositories
───────────────────────────────────────────── */
repositories {
  mavenCentral()
}

/* ─────────────────────────────────────────────
   Configurations
───────────────────────────────────────────── */
configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }

  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

/* ─────────────────────────────────────────────
   Dependencies
───────────────────────────────────────────── */
dependencies {

  // Spring Boot Core
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'

  // Database
  runtimeOnly "org.postgresql:postgresql:${postgresqlVersion}"
  testRuntimeOnly 'com.h2database:h2'

  // Flyway
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-database-postgresql'

  // MapStruct
  implementation "org.mapstruct:mapstruct:${mapstructVersion}"

  // Lombok
  compileOnly "org.projectlombok:lombok:${lombokVersion}"
  annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
  annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
  annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

  testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
  testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
  testAnnotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
  testAnnotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

  // OpenAPI
  implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

  // Testing
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
  testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
  testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
  testImplementation "io.rest-assured:spring-mock-mvc:${restAssuredVersion}"
}

/* ─────────────────────────────────────────────
   Compile Options
───────────────────────────────────────────── */
tasks.withType(JavaCompile).configureEach {
  options.compilerArgs += [
    '-parameters',
    '-Amapstruct.defaultComponentModel=spring',
    '-Amapstruct.unmappedTargetPolicy=WARN'
  ]
}

/* ─────────────────────────────────────────────
   SOURCE SETS (INTEGRATION)
───────────────────────────────────────────── */
sourceSets {
  integrationTest {
    java.srcDir file('src/integrationTest/java')
    resources.srcDir file('src/integrationTest/resources')

    compileClasspath += sourceSets.main.output + sourceSets.test.output
    runtimeClasspath += output + compileClasspath
  }
}

/* ─────────────────────────────────────────────
   UNIT TESTS (DEFAULT)
───────────────────────────────────────────── */
/* ─────────────────────────────────────────────
   TEST LOGGING (shared config)
───────────────────────────────────────────── */
tasks.named('test') {
  useJUnitPlatform()

  include '**/*Test.class'
  include '**/*Tests.class'
  include '**/*SmokeTest.class'

  exclude '**/*IT.class'
  exclude '**/*IntegrationTest.class'
  exclude '**/*ApiTest.class'
}

/* ─────────────────────────────────────────────
   API TEST TASK
───────────────────────────────────────────── */
tasks.register('apiTest', Test) {
  description = 'Runs API tests'
  group = 'verification'

  useJUnitPlatform {
    includeTags 'api'
  }

  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath

  include '**/*ApiTest.class'
}

/* ─────────────────────────────────────────────
   INTEGRATION TEST TASK
───────────────────────────────────────────── */
tasks.register('integrationTest', Test) {
  description = 'Runs integration tests'
  group = 'verification'

  useJUnitPlatform {
    includeTags 'integration'
  }

  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath

  include '**/*IT.class'
  include '**/*IntegrationTest.class'

  shouldRunAfter tasks.test
}

/* ─────────────────────────────────────────────
   SMOKE TEST TASK
───────────────────────────────────────────── */
tasks.register('smokeTest', Test) {
  description = 'Runs smoke tests'
  group = 'verification'

  useJUnitPlatform {
    includeTags 'smoke'
  }

  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath

  include '**/*SmokeTest.class'
}

/* ─────────────────────────────────────────────
   CHECK TASK
───────────────────────────────────────────── */
tasks.named('check') {
  dependsOn tasks.test
  dependsOn tasks.apiTest
  dependsOn tasks.integrationTest
  dependsOn tasks.smokeTest
}

/* ─────────────────────────────────────────────
   JACOCO
───────────────────────────────────────────── */
jacoco {
  toolVersion = jacocoVersion
}

tasks.named('jacocoTestReport') {
  dependsOn tasks.test

  reports {
    xml.required = true
    html.required = true
    // Explicit output dir so you always know where to look
    html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
  }
}

tasks.named('jacocoTestCoverageVerification') {
  // Must have a report before verifying
  dependsOn tasks.jacocoTestReport

  violationRules {
    rule {
      excludes = [
        '**/mapper/**',
        '**/entity/**',
        '**/dto/**',
        '**/config/**',
        '**/*Application*'
      ]
      limit {
        counter = 'LINE'
        value = 'COVEREDRATIO'
        minimum = 0.80
      }
    }
  }
}

tasks.named('check') {
  // This pulls in jacocoTestReport transitively via the dependsOn above
  dependsOn tasks.jacocoTestCoverageVerification
}

/* ─────────────────────────────────────────────
   FLYWAY
───────────────────────────────────────────── */
flyway {
  url = 'jdbc:postgresql://localhost:5433/taskmanager'
  user = 'postgres'
  password = 'postgres'

  locations = ['classpath:db/migration']
  cleanDisabled = false
  baselineOnMigrate = true

  configurations = ['flywayMigration']
}

/* ─────────────────────────────────────────────
   JAR OUTPUT
───────────────────────────────────────────── */
tasks.named('bootJar') {
  archiveFileName = 'task-manager.jar'
}

/* ─────────────────────────────────────────────
   TEST LOGGING (shared config)
───────────────────────────────────────────── */
tasks.withType(Test).configureEach {
  outputs.upToDateWhen { false }
  testLogging {
    events 'passed', 'failed', 'skipped'
    exceptionFormat 'full'
    showStandardStreams = false
    showCauses = true
    showExceptions = true
    showStackTraces = true
  }
}
