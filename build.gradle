buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath "org.flywaydb:flyway-database-postgresql:11.8.2"
    classpath "org.postgresql:postgresql:42.7.5"
  }
}

plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.11'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'jacoco'
  id 'org.flywaydb.flyway' version '11.8.2'
}

group = 'com.secura'
version = '1.0.0'
description = 'Enterprise Task Manager API'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

ext {
  mapstructVersion = '1.6.3'
  lombokVersion = '1.18.44'
  testcontainersVersion = '1.20.4'
  restAssuredVersion = '5.5.0'
  springdocVersion = '2.8.3'
  jacocoVersion = '0.8.12'
  postgresqlVersion = '42.7.5'
  flywayVersion = '11.8.2'
}

repositories {
  mavenCentral()
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }

  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom testRuntimeOnly

  flywayMigration
}

dependencies {

  // Core
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'

  // Database
  runtimeOnly "org.postgresql:postgresql:${postgresqlVersion}"

  // Flyway (runtime for Spring Boot)
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-database-postgresql'

  // Flyway (Gradle plugin runtime FIX)
  flywayMigration "org.flywaydb:flyway-database-postgresql:${flywayVersion}"
  flywayMigration "org.postgresql:postgresql:${postgresqlVersion}"

  // MapStruct
  implementation "org.mapstruct:mapstruct:${mapstructVersion}"
  annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

  // Lombok
  compileOnly "org.projectlombok:lombok:${lombokVersion}"
  annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

  testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
  testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

  // OpenAPI
  implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

  // Test
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
  testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
  testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
  testImplementation "io.rest-assured:spring-mock-mvc:${restAssuredVersion}"
}

tasks.named('bootJar') {
  archiveFileName = 'task-manager.jar'
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs += [
    '-Amapstruct.defaultComponentModel=spring'
  ]
}

tasks.named('test') {
  useJUnitPlatform()

  include '**/*Test.class'
  include '**/*Tests.class'
  include '**/*SmokeTest.class'

  exclude '**/*IT.class'
  exclude '**/*IntegrationTest.class'
  exclude '**/*ApiTest.class'
}

sourceSets {
  integrationTest {
    java.srcDir file('src/integrationTest/java')
    resources.srcDir file('src/integrationTest/resources')
    compileClasspath += sourceSets.main.output + sourceSets.test.output
    runtimeClasspath += output + compileClasspath
  }
}

tasks.register('integrationTest', Test) {
  description = 'Runs integration and API tests.'
  group = 'verification'

  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath

  useJUnitPlatform()

  include '**/*IT.class'
  include '**/*IntegrationTest.class'
  include '**/*ApiTest.class'

  shouldRunAfter tasks.test
}

tasks.named('check') {
  dependsOn tasks.integrationTest
}

jacoco {
  toolVersion = jacocoVersion
}

tasks.named('jacocoTestReport') {
  dependsOn tasks.test

  reports {
    xml.required = true
    html.required = true
    csv.required = false
  }
}

tasks.named('jacocoTestCoverageVerification') {
  violationRules {
    rule {
      limit {
        counter = 'LINE'
        value = 'COVEREDRATIO'
        minimum = 0.80
      }
    }
  }
}

tasks.named('check') {
  dependsOn tasks.jacocoTestCoverageVerification
}

flyway {
  url = 'jdbc:postgresql://localhost:5433/taskmanager'
  user = 'postgres'
  password = 'postgres'

  locations = ['classpath:db/migration']
  cleanDisabled = false
  baselineOnMigrate = true

  // 🔥 THIS FIXES YOUR ERROR
  configurations = ['flywayMigration']
}

tasks.register('unitTests', Test) {
  description = 'Runs unit tests only'
  group = 'verification'

  useJUnitPlatform {
    includeTags 'unit'
  }
}

tasks.register('integrationTestsTagged', Test) {
  description = 'Runs tagged integration tests only'
  group = 'verification'

  useJUnitPlatform {
    includeTags 'integration'
  }
}
